name: Publish to PyPI

# Publishes via PyPI Trusted Publishing (OIDC). Before enabling the `release`
# trigger, configure a pending publisher on PyPI for this repo + the `pypi`
# environment + this workflow. Until then, run manually from the Actions tab.
on:
  workflow_dispatch:
  # release:
  #   types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build:
    # PyPI files are immutable: re-running this workflow for a version that is
    # already online must skip the upload, not fail.
    outputs:
      already_published: ${{ steps.pypi.outputs.already_published }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check whether this version is already on PyPI
        id: pypi
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          code=$(curl -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/vibe-fim/${version}/json")
          case "$code" in
            200)
              echo "already_published=true" >> "$GITHUB_OUTPUT"
              echo "::notice::vibe-fim ${version} is already on PyPI; the publish job is skipped."
              ;;
            404)
              echo "already_published=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unexpected HTTP ${code} from PyPI for vibe-fim ${version}"
              exit 1
              ;;
          esac
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check artifacts
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Only ever publish from main or a version tag — never an arbitrary ref.
    if: >-
      needs.build.outputs.already_published != 'true' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    environment: pypi
    permissions:
      id-token: write   # OIDC for PyPI Trusted Publishing — no token stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
