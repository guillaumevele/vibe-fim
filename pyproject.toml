[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibe-fim"
version = "0.4.2"
description = "Bounded AI code edits via Codestral fill-in-the-middle: rewrite only the region between two anchors, the rest stays byte-identical."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Guillaume Vele" }]
keywords = ["mistral", "codestral", "fim", "fill-in-the-middle", "code-editing", "llm", "vibe"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/guillaumevele/vibe-fim"
Repository = "https://github.com/guillaumevele/vibe-fim"
Issues = "https://github.com/guillaumevele/vibe-fim/issues"

[project.scripts]
vibe-fim = "vibe_fim.cli:main"
vibe-fim-mcp = "vibe_fim.mcp_server:main"

[project.optional-dependencies]
dev = ["pytest>=7"]
mcp = ["mcp>=1.2; python_version >= '3.10'"]

[tool.hatch.build.targets.wheel]
packages = ["vibe_fim"]
